<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Nobel Capital</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0d0d0d;
    --border: #1a1a1a;
    --divider: #2a2a2a;
    --gold: #b8962e;
    --gold-light: #d4ae4a;
    --green: #4ade80;
    --red: #f87171;
    --text: #ffffff;
    --muted: #666666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 72px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo img {
    height: 64px;
    display: block;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  #clock {
    font-size: 42px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  #date-label {
    font-size: 18px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── Slides ── */
  .slides-wrapper {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    inset: 0;
    padding: 40px 72px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
    z-index: 0;
  }

  .slide.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
  }

  /* ── Slide title ── */
  .slide-title {
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--gold);
    margin-bottom: 36px;
  }

  /* ── Captação hero (split bar model) ── */
  .cap-hero-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 36px;
  }

  .cap-hero-label {
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .cap-hero-value {
    font-size: 76px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    line-height: 1;
    margin-bottom: 24px;
  }

  .cap-hero-value.positive { color: var(--green); }
  .cap-hero-value.negative { color: var(--red); }

  .split-bar {
    display: flex;
    width: 100%;
    height: 90px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .split-saida {
    background: #111111;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-size: 24px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    transition: width 0.6s ease;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    padding: 0 20px;
  }

  .split-entrada {
    background: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000000;
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    transition: width 0.6s ease;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    padding: 0 20px;
  }

  .split-pcts {
    display: flex;
    width: 100%;
    margin-bottom: 36px;
  }

  .split-pct-item {
    text-align: center;
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* ── Custódia hero ── */
  .hero-row {
    display: flex;
    align-items: flex-end;
    gap: 56px;
    margin-bottom: 32px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }

  .hero-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .hero-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .hero-value {
    font-size: 68px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--gold);
  }

  .secondary-group {
    display: flex;
    gap: 40px;
    padding-bottom: 6px;
  }

  .secondary-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .secondary-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .secondary-value {
    font-size: 30px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .secondary-value.gold { color: var(--gold); }

  /* ── Duas tabelas lado a lado ── */
  .tables-row {
    display: flex;
    gap: 56px;
  }

  .table-col {
    display: flex;
    flex-direction: column;
  }

  .table-col-equipe { flex: 0 0 44%; }
  .table-col-tipo   { flex: 1; }

  .table-col-header {
    display: grid;
    padding: 0 0 14px;
    border-bottom: 1px solid var(--gold);
    margin-bottom: 4px;
  }

  .table-col-header span {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold);
    text-align: right;
  }

  .table-col-header span:first-child { text-align: left; color: var(--muted); }

  /* equipe: 4 colunas */
  .header-equipe { grid-template-columns: 1fr 148px 148px 148px; }
  .row-equipe    { grid-template-columns: 1fr 148px 148px 148px; }

  /* tipo: 4 colunas */
  .header-tipo { grid-template-columns: 1fr 136px 136px 136px; }
  .row-tipo    { grid-template-columns: 1fr 136px 136px 136px; }

  .table-col-list {
    display: flex;
    flex-direction: column;
  }

  .table-col-row {
    display: grid;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }

  .table-col-row:last-child { border-bottom: none; }

  .col-name {
    font-size: 19px;
    font-weight: 500;
    color: var(--text);
  }

  .col-val {
    font-size: 18px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .col-val.gold    { color: var(--gold); }
  .col-val.pos     { color: var(--green); }
  .col-val.neg     { color: var(--red); }
  .col-val.muted   { color: var(--muted); font-weight: 400; }

  /* ── Ranking table (kept for slide 2) ── */
  .ranking-header {
    display: grid;
    grid-template-columns: 1fr 180px 180px 180px;
    padding: 0 0 10px;
    border-bottom: 1px solid var(--gold);
    margin-bottom: 4px;
  }

  .ranking-header span {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold);
    text-align: right;
  }

  .ranking-header span:first-child { text-align: left; color: var(--muted); }

  .ranking-list {
    display: flex;
    flex-direction: column;
  }

  .ranking-row {
    display: grid;
    grid-template-columns: 1fr 180px 180px 180px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .ranking-row:last-child { border-bottom: none; }

  .ranking-equipe {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
  }

  .ranking-cell {
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .ranking-cell.gold { color: var(--gold); }
  .ranking-cell.positive { color: var(--green); }
  .ranking-cell.negative { color: var(--red); }
  .ranking-cell.muted { color: var(--muted); font-weight: 400; font-size: 14px; }

  /* custódia: 2 colunas */
  .ranking-header.two-col {
    grid-template-columns: 1fr 220px 140px;
  }
  .ranking-row.two-col {
    grid-template-columns: 1fr 220px 140px;
  }

  /* ── Footer ── */
  footer { flex-shrink: 0; }

  .progress-bar-track {
    width: 100%;
    height: 2px;
    background: var(--border);
  }

  .progress-bar-fill {
    height: 2px;
    background: var(--gold);
    width: 0%;
    transition: width 1s linear;
  }

  .footer-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 56px 14px;
  }

  .footer-ref { font-size: 15px; color: var(--muted); letter-spacing: 0.04em; }

  .slide-dots { display: flex; gap: 8px; align-items: center; }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--divider);
    transition: background 0.3s;
    cursor: pointer;
  }

  .dot.active { background: var(--gold); }

  /* ── Loading ── */
  #loading {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    gap: 14px;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  Carregando
</div>

<header>
  <div class="logo">
    <img src="/nobel.png" alt="Nobel Capital">
  </div>
  <div class="header-right">
    <div id="clock">--:--:--</div>
    <div id="date-label">--</div>
  </div>
</header>

<div class="slides-wrapper">

  <!-- SLIDE 1: Captação -->
  <div class="slide active" id="slide-0">
    <div class="slide-title">Captação do Mês</div>

    <div class="cap-hero-section">
      <div class="cap-hero-label">Captação Líquida</div>
      <div class="cap-hero-value" id="cap-total">—</div>

      <div class="split-bar" id="cap-split-bar">
        <div class="split-saida" id="cap-split-saida" style="width:50%">—</div>
        <div class="split-entrada" id="cap-split-entrada" style="width:50%">—</div>
      </div>
      <div class="split-pcts" id="cap-split-pcts">
        <div class="split-pct-item" id="cap-pct-saida" style="width:50%">—</div>
        <div class="split-pct-item" id="cap-pct-entrada" style="width:50%">—</div>
      </div>
    </div>

    <div class="tables-row">
      <!-- Esquerda: por equipe -->
      <div class="table-col table-col-equipe">
        <div class="table-col-header header-equipe">
          <span>Equipe</span>
          <span>Líquido</span>
          <span>Entrada</span>
          <span>Saída</span>
        </div>
        <div class="table-col-list" id="cap-ranking"></div>
      </div>

      <!-- Direita: por tipo -->
      <div class="table-col table-col-tipo">
        <div class="table-col-header header-tipo">
          <span>Tipo</span>
          <span>Entrada</span>
          <span>Saída</span>
          <span>Líquido</span>
        </div>
        <div class="table-col-list" id="cap-tipos"></div>
      </div>
    </div>
  </div>

  <!-- SLIDE 3: Receita -->
  <div class="slide" id="slide-2">
    <div class="slide-title">Receita por Classe de Produto</div>
    <div style="text-align:center;margin-bottom:16px;flex-shrink:0;">
      <div class="cap-hero-label">Receita Total</div>
      <div class="cap-hero-value gold" id="rec-total" style="margin-bottom:0;">—</div>
    </div>
    <div id="rec-bubbles-wrap" style="flex:1;min-height:0;width:100%;position:relative;">
      <svg id="rec-bubbles" style="width:100%;height:100%;display:block;"></svg>
    </div>
  </div>

  <!-- SLIDE 2: Custódia -->
  <div class="slide" id="slide-1">
    <div class="slide-title">Custódia (AUM)</div>

    <div class="cap-hero-section">
      <div class="cap-hero-label">AUM Total</div>
      <div class="cap-hero-value gold" id="cust-total">—</div>

      <div class="split-bar" id="cust-split-bar">
        <div class="split-saida" id="cust-split-pj" style="width:50%">—</div>
        <div class="split-entrada" id="cust-split-pf" style="width:50%">—</div>
      </div>
      <div class="split-pcts" id="cust-split-pcts">
        <div class="split-pct-item" id="cust-pct-pj" style="width:50%">— PJ</div>
        <div class="split-pct-item" id="cust-pct-pf" style="width:50%">— PF</div>
      </div>
    </div>

    <div class="tables-row">
      <!-- Esquerda: por equipe -->
      <div class="table-col table-col-equipe">
        <div class="table-col-header header-equipe" style="grid-template-columns: 1fr 130px 100px;">
          <span>Equipe</span>
          <span>Custódia</span>
          <span>Clientes</span>
        </div>
        <div class="table-col-list" id="cust-ranking"></div>
      </div>

      <!-- Direita: PF vs PJ por equipe -->
      <div class="table-col table-col-tipo">
        <div class="table-col-header header-tipo" style="grid-template-columns: 1fr 130px 100px 130px 100px;">
          <span>Equipe</span>
          <span>PF</span>
          <span>Cli.</span>
          <span>PJ</span>
          <span>Cli.</span>
        </div>
        <div class="table-col-list" id="cust-equipe-pfpj"></div>
      </div>
    </div>
  </div>

</div>

<footer>
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progress"></div>
  </div>
  <div class="footer-info">
    <div class="footer-ref" id="footer-ref">—</div>
    <div class="slide-dots">
      <div class="dot active" data-i="0"></div>
      <div class="dot" data-i="1"></div>
      <div class="dot" data-i="2"></div>
    </div>
  </div>
</footer>

<script>
const SLIDE_DURATION = 60;
const REFRESH_INTERVAL = 5 * 60 * 1000;
const NUM_SLIDES = 3;

let currentSlide = 0;
let slideTimer = null;
let dados = null;

function formatBRL(val) {
  const abs = Math.abs(val);
  const sign = val < 0 ? '-' : '';
  if (abs >= 1e9) return sign + 'R$ ' + (abs / 1e9).toFixed(2).replace('.', ',') + ' bi';
  if (abs >= 1e6) return sign + 'R$ ' + (abs / 1e6).toFixed(1).replace('.', ',') + ' M';
  if (abs >= 1e3) return sign + 'R$ ' + (abs / 1e3).toFixed(0) + ' mil';
  return sign + 'R$ ' + abs.toFixed(0);
}

// helpers para compatibilidade com browsers antigos (TVs)
function n(x) { return (x === null || x === undefined) ? 0 : x; }
function arr(x) { return (x === null || x === undefined) ? [] : x; }
function obj(x) { return (x === null || x === undefined) ? {} : x; }

function pad(v) { return v < 10 ? '0' + v : '' + v; }

function fmtInt(v) {
  var s = String(Math.round(n(v))), r = '', c = 0;
  for (var i = s.length - 1; i >= 0; i--) {
    if (c > 0 && c % 3 === 0) r = '.' + r;
    r = s[i] + r; c++;
  }
  return r;
}

function formatBRLFull(val) {
  val = n(val);
  var neg = val < 0, abs = Math.abs(val);
  var str = abs.toFixed(2), parts = str.split('.');
  var intPart = parts[0], dec = parts[1];
  var r = '', c = 0;
  for (var i = intPart.length - 1; i >= 0; i--) {
    if (c > 0 && c % 3 === 0) r = '.' + r;
    r = intPart[i] + r; c++;
  }
  return (neg ? '-' : '') + 'R$ ' + r + ',' + dec;
}

function formatDate(iso) {
  if (!iso) return '—';
  try {
    var d = new Date(iso);
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
  } catch (e) { return '—'; }
}

function updateClock() {
  var now = new Date();
  document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  var dias = ['DOMINGO','SEGUNDA-FEIRA','TERÇA-FEIRA','QUARTA-FEIRA','QUINTA-FEIRA','SEXTA-FEIRA','SÁBADO'];
  var meses = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
  document.getElementById('date-label').textContent = dias[now.getDay()] + ', ' + pad(now.getDate()) + ' DE ' + meses[now.getMonth()];
}
setInterval(updateClock, 1000);
updateClock();

function renderCaptacao(cap) {
  var total = n(cap.total);
  var positivo = n(cap.positivo);
  var negativo = Math.abs(n(cap.negativo));

  var el = document.getElementById('cap-total');
  el.textContent = formatBRLFull(total);
  el.className = 'cap-hero-value ' + (total >= 0 ? 'positive' : 'negative');

  var totalAbs = positivo + negativo;
  var saidaPct = totalAbs > 0 ? (negativo / totalAbs * 100) : 50;
  var entradaPct = 100 - saidaPct;

  document.getElementById('cap-split-saida').style.width = saidaPct.toFixed(1) + '%';
  document.getElementById('cap-split-saida').textContent = formatBRLFull(n(cap.negativo));
  document.getElementById('cap-split-entrada').style.width = entradaPct.toFixed(1) + '%';
  document.getElementById('cap-split-entrada').textContent = formatBRLFull(positivo);
  document.getElementById('cap-pct-saida').style.width = saidaPct.toFixed(1) + '%';
  document.getElementById('cap-pct-saida').textContent = saidaPct.toFixed(1) + '%';
  document.getElementById('cap-pct-entrada').style.width = entradaPct.toFixed(1) + '%';
  document.getElementById('cap-pct-entrada').textContent = entradaPct.toFixed(1) + '%';

  var tiposList = document.getElementById('cap-tipos');
  tiposList.innerHTML = '';
  arr(cap.por_tipo).forEach(function(t) {
    var liq = n(t.liquido);
    var row = document.createElement('div');
    row.className = 'table-col-row row-tipo';
    row.innerHTML = '<div class="col-name">' + t.tipo + '</div>' +
      '<div class="col-val pos">' + formatBRL(n(t.entrada)) + '</div>' +
      '<div class="col-val neg">' + formatBRL(n(t.saida)) + '</div>' +
      '<div class="col-val ' + (liq >= 0 ? 'pos' : 'neg') + '">' + formatBRL(liq) + '</div>';
    tiposList.appendChild(row);
  });

  var list = document.getElementById('cap-ranking');
  list.innerHTML = '';
  arr(cap.por_equipe).forEach(function(e) {
    var val = n(e.total);
    var row = document.createElement('div');
    row.className = 'table-col-row row-equipe';
    row.innerHTML = '<div class="col-name">' + e.equipe + '</div>' +
      '<div class="col-val ' + (val >= 0 ? 'pos' : 'neg') + '">' + formatBRL(val) + '</div>' +
      '<div class="col-val pos">' + formatBRL(n(e.positivo)) + '</div>' +
      '<div class="col-val neg">' + formatBRL(n(e.negativo)) + '</div>';
    list.appendChild(row);
  });
}

function renderCustodia(cust) {
  document.getElementById('cust-total').textContent = formatBRL(n(cust.total));

  var tipoPessoa = arr(cust.por_tipo_pessoa);
  var pfFound = tipoPessoa.filter(function(t) { return t.tipo_pessoa === 'PF'; });
  var pjFound = tipoPessoa.filter(function(t) { return t.tipo_pessoa === 'PJ'; });
  var pfRow = pfFound.length ? pfFound[0] : { custodia: 0, clientes: 0 };
  var pjRow = pjFound.length ? pjFound[0] : { custodia: 0, clientes: 0 };
  var totalAbs = n(pfRow.custodia) + n(pjRow.custodia);
  var pjPct = totalAbs > 0 ? (n(pjRow.custodia) / totalAbs * 100) : 50;
  var pfPct = 100 - pjPct;

  document.getElementById('cust-split-pj').style.width = pjPct.toFixed(1) + '%';
  document.getElementById('cust-split-pj').textContent = 'PJ  ' + formatBRLFull(n(pjRow.custodia));
  document.getElementById('cust-split-pf').style.width = pfPct.toFixed(1) + '%';
  document.getElementById('cust-split-pf').textContent = 'PF  ' + formatBRLFull(n(pfRow.custodia));
  document.getElementById('cust-pct-pj').style.width = pjPct.toFixed(1) + '%';
  document.getElementById('cust-pct-pj').textContent = pjPct.toFixed(1) + '%  ·  ' + fmtInt(pjRow.clientes) + ' clientes';
  document.getElementById('cust-pct-pf').style.width = pfPct.toFixed(1) + '%';
  document.getElementById('cust-pct-pf').textContent = pfPct.toFixed(1) + '%  ·  ' + fmtInt(pfRow.clientes) + ' clientes';

  var list = document.getElementById('cust-ranking');
  list.innerHTML = '';
  arr(cust.por_equipe).forEach(function(e) {
    var row = document.createElement('div');
    row.className = 'table-col-row';
    row.style.gridTemplateColumns = '1fr 130px 100px';
    row.innerHTML = '<div class="col-name">' + e.equipe + '</div>' +
      '<div class="col-val gold">' + formatBRL(n(e.custodia)) + '</div>' +
      '<div class="col-val muted">' + fmtInt(e.clientes) + '</div>';
    list.appendChild(row);
  });

  var pfpjList = document.getElementById('cust-equipe-pfpj');
  pfpjList.innerHTML = '';
  arr(cust.equipe_pfpj).forEach(function(e) {
    var row = document.createElement('div');
    row.className = 'table-col-row';
    row.style.gridTemplateColumns = '1fr 130px 100px 130px 100px';
    row.innerHTML = '<div class="col-name">' + e.equipe + '</div>' +
      '<div class="col-val gold">' + formatBRL(n(e.pf)) + '</div>' +
      '<div class="col-val muted">' + fmtInt(e.clientes_pf) + '</div>' +
      '<div class="col-val gold">' + formatBRL(n(e.pj)) + '</div>' +
      '<div class="col-val muted">' + fmtInt(e.clientes_pj) + '</div>';
    pfpjList.appendChild(row);
  });
}

function formatBRLShort(val) {
  val = n(val);
  if (val >= 1e6) return 'R$ ' + (val / 1e6).toFixed(1) + 'M';
  if (val >= 1e3) return 'R$ ' + Math.round(val / 1e3) + 'k';
  return formatBRL(val);
}

function renderReceita(rec) {
  document.getElementById('rec-total').textContent = formatBRL(n(rec.total));
  var items = arr(rec.por_classe).filter(function(i) { return n(i.total) > 0; });
  if (!items.length) return;

  var wrap = document.getElementById('rec-bubbles-wrap');
  var W = wrap.offsetWidth, H = wrap.offsetHeight;
  if (W < 10 || H < 10) return;

  var N = items.length;
  var maxVal = Math.max.apply(null, items.map(function(i) { return n(i.total); }));

  /* ── raio máximo baseado na grade estimada para N itens ── */
  var cols = Math.ceil(Math.sqrt(N * W / H));
  var rows = Math.ceil(N / cols);
  var maxR = Math.min(W / cols, H / rows) * 0.43;
  var minR = Math.max(18, maxR * 0.22);
  var pad  = 8;
  var yScale = H / W; /* spiral respeita o aspecto do canvas */

  var circles = items.slice()
    .sort(function(a, b) { return n(b.total) - n(a.total); })
    .map(function(item) {
      var ratio = Math.sqrt(n(item.total) / maxVal);
      var r = minR + (maxR - minR) * ratio;
      return { classe: item.classe, total: n(item.total), r: r, ratio: ratio, x: 0, y: 0, baseR: r };
    });

  /* ── spiral packing ── */
  function tryPack(sc) {
    var placed = [];
    for (var ci = 0; ci < circles.length; ci++) {
      var c = circles[ci];
      var r = Math.max(minR * 0.5, c.baseR * sc);
      var found = false;
      var limit = Math.max(W, H);
      for (var dist = 0; dist <= limit && !found; dist += 2) {
        var nSteps = Math.max(8, Math.round(2 * Math.PI * Math.max(dist, 4) / 3));
        for (var s = 0; s < nSteps && !found; s++) {
          var a = (s / nSteps) * 2 * Math.PI;
          var x = W / 2 + dist * Math.cos(a);
          var y = H / 2 + dist * Math.sin(a) * yScale;
          if (x - r < 0 || x + r > W || y - r < 0 || y + r > H) continue;
          var ok = true;
          for (var pi = 0; pi < placed.length && ok; pi++) {
            var p = placed[pi];
            var minD = p.r + r + pad;
            if ((x - p.x) * (x - p.x) + (y - p.y) * (y - p.y) < minD * minD) ok = false;
          }
          if (ok) { c.x = x; c.y = y; c.r = r; placed.push(c); found = true; }
        }
      }
      if (!found) return false;
    }
    return true;
  }

  var scale = 1.0, packed = false;
  while (scale > 0.15) {
    if (tryPack(scale)) { packed = true; break; }
    scale -= 0.04;
  }

  if (!packed) {
    /* fallback: 2 linhas horizontais centralizadas */
    var areaSum = circles.reduce(function(s, c) { return s + Math.PI * c.baseR * c.baseR; }, 0);
    var sc = Math.min(1, Math.sqrt(W * H * 0.55 / areaSum));
    circles.forEach(function(c) { c.r = Math.max(minR * 0.4, c.baseR * sc); });
    var half = Math.ceil(N / 2);
    function placeRow(arr, cy) {
      var totalW = arr.reduce(function(s, c) { return s + c.r * 2 + pad; }, -pad);
      var x = (W - totalW) / 2;
      arr.forEach(function(c) { x += c.r; c.x = x; c.y = cy; x += c.r + pad; });
    }
    placeRow(circles.slice(0, half), half < N ? H * 0.33 : H * 0.5);
    if (half < N) placeRow(circles.slice(half), H * 0.68);
  }

  /* ── build SVG ── */
  var svg = document.getElementById('rec-bubbles');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('overflow', 'hidden');
  svg.innerHTML = '';
  var ns = 'http://www.w3.org/2000/svg';
  var defs = document.createElementNS(ns, 'defs');

  /* shadow blur */
  var fBlur = document.createElementNS(ns, 'filter');
  fBlur.setAttribute('id', 'bblur');
  fBlur.setAttribute('x', '-50%'); fBlur.setAttribute('y', '-50%');
  fBlur.setAttribute('width', '200%'); fBlur.setAttribute('height', '200%');
  var gb = document.createElementNS(ns, 'feGaussianBlur');
  gb.setAttribute('stdDeviation', '7');
  fBlur.appendChild(gb);
  defs.appendChild(fBlur);

  /* per-bubble gradients + clip paths (após posicionamento final) */
  circles.forEach(function(c, i) {
    var baseL   = Math.round(28 + c.ratio * 44);
    var baseSat = Math.round(80 - c.ratio * 18);
    var hiL     = Math.min(94, baseL + 54);
    var darkL   = Math.max(6, baseL - 28);

    var rg = document.createElementNS(ns, 'radialGradient');
    rg.setAttribute('id', 'rg' + i);
    rg.setAttribute('cx', '35%'); rg.setAttribute('cy', '28%');
    rg.setAttribute('r', '72%'); rg.setAttribute('fx', '28%'); rg.setAttribute('fy', '20%');
    [
      [0,   'hsl(42,50%,' + hiL + '%)'],
      [42,  'hsl(42,' + baseSat + '%,' + baseL + '%)'],
      [100, 'hsl(34,' + Math.round(baseSat * 0.72) + '%,' + darkL + '%)']
    ].forEach(function(p) {
      var s = document.createElementNS(ns, 'stop');
      s.setAttribute('offset', p[0] + '%'); s.setAttribute('stop-color', p[1]);
      rg.appendChild(s);
    });
    defs.appendChild(rg);

    var rim = document.createElementNS(ns, 'radialGradient');
    rim.setAttribute('id', 'rim' + i);
    rim.setAttribute('cx', '50%'); rim.setAttribute('cy', '50%'); rim.setAttribute('r', '50%');
    [[58, 'rgba(0,0,0,0)'], [100, 'rgba(0,0,0,0.40)']].forEach(function(p) {
      var s = document.createElementNS(ns, 'stop');
      s.setAttribute('offset', p[0] + '%'); s.setAttribute('stop-color', p[1]);
      rim.appendChild(s);
    });
    defs.appendChild(rim);

    /* clip path para texto não vazar da bolha */
    var cp = document.createElementNS(ns, 'clipPath');
    cp.setAttribute('id', 'cp' + i);
    var cpC = document.createElementNS(ns, 'circle');
    cpC.setAttribute('cx', c.x); cpC.setAttribute('cy', c.y); cpC.setAttribute('r', c.r * 0.88);
    cp.appendChild(cpC);
    defs.appendChild(cp);
  });

  svg.appendChild(defs);

  /* ── DRAW ── */
  circles.forEach(function(c, i) {
    var baseL = Math.round(28 + c.ratio * 44);
    var ink   = baseL > 52 ? '#1a0f00' : '#fceeb5';

    /* sombra */
    var sh = document.createElementNS(ns, 'circle');
    sh.setAttribute('cx', c.x + 3); sh.setAttribute('cy', c.y + 8);
    sh.setAttribute('r', c.r * 0.85);
    sh.setAttribute('fill', 'rgba(0,0,0,0.50)');
    sh.setAttribute('filter', 'url(#bblur)');
    svg.appendChild(sh);

    /* esfera */
    var sphere = document.createElementNS(ns, 'circle');
    sphere.setAttribute('cx', c.x); sphere.setAttribute('cy', c.y);
    sphere.setAttribute('r', c.r);
    sphere.setAttribute('fill', 'url(#rg' + i + ')');
    svg.appendChild(sphere);

    /* borda escura */
    var rimC = document.createElementNS(ns, 'circle');
    rimC.setAttribute('cx', c.x); rimC.setAttribute('cy', c.y);
    rimC.setAttribute('r', c.r);
    rimC.setAttribute('fill', 'url(#rim' + i + ')');
    svg.appendChild(rimC);

    /* labels clippados ao círculo */
    var showVal = c.r > 28;
    var fs1 = Math.max(11, Math.min(48, c.r * 0.46));
    var fs2 = Math.max(9,  Math.min(34, c.r * 0.32));
    var oy  = showVal ? -(fs1 * 0.52) : 0;

    var g = document.createElementNS(ns, 'g');
    g.setAttribute('clip-path', 'url(#cp' + i + ')');

    var t1 = document.createElementNS(ns, 'text');
    t1.setAttribute('x', c.x); t1.setAttribute('y', c.y + oy);
    t1.setAttribute('text-anchor', 'middle'); t1.setAttribute('dominant-baseline', 'middle');
    t1.setAttribute('fill', ink); t1.setAttribute('font-size', fs1 + 'px');
    t1.setAttribute('font-weight', '700');
    t1.setAttribute('font-family', "'Segoe UI',system-ui,sans-serif");
    t1.textContent = c.classe;
    g.appendChild(t1);

    if (showVal) {
      var t2 = document.createElementNS(ns, 'text');
      t2.setAttribute('x', c.x); t2.setAttribute('y', c.y + oy + fs1 + 3);
      t2.setAttribute('text-anchor', 'middle'); t2.setAttribute('dominant-baseline', 'middle');
      t2.setAttribute('fill', ink); t2.setAttribute('font-size', fs2 + 'px');
      t2.setAttribute('font-family', "'Segoe UI',system-ui,sans-serif");
      t2.textContent = formatBRLShort(c.total);
      g.appendChild(t2);
    }

    svg.appendChild(g);
  });
}

function renderFooter() {
  if (!dados) return;
  var refs = [
    'Ref: ' + formatDate(dados.captacao && dados.captacao.data_ref) + '  ·  Atualizado em ' + formatDate(dados.captacao && dados.captacao.data_atualizacao),
    'Posição: ' + formatDate(dados.custodia && dados.custodia.data_posicao),
    'Atualizado em ' + formatDate(dados.captacao && dados.captacao.data_atualizacao),
  ];
  document.getElementById('footer-ref').textContent = refs[currentSlide] || '—';
}

document.querySelectorAll('.dot').forEach(function(d) {
  d.addEventListener('click', function() { goToSlide(parseInt(d.getAttribute('data-i'))); });
});

function goToSlide(idx) {
  document.querySelectorAll('.slide').forEach(function(s, i) { s.classList.toggle('active', i === idx); });
  document.querySelectorAll('.dot').forEach(function(d, i) { d.classList.toggle('active', i === idx); });
  currentSlide = idx;
  renderFooter();
  startProgress();
}

function startProgress() {
  clearTimeout(slideTimer);
  var bar = document.getElementById('progress');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  bar.getBoundingClientRect();
  bar.style.transition = 'width ' + SLIDE_DURATION + 's linear';
  bar.style.width = '100%';
  slideTimer = setTimeout(function() { goToSlide((currentSlide + 1) % NUM_SLIDES); }, SLIDE_DURATION * 1000);
}

function fetchDados() {
  return fetch('/api/dados').then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });
}

function init() {
  var loadingEl = document.getElementById('loading');
  fetchDados().then(function(data) {
    dados = data;
    try { renderCaptacao(obj(dados.captacao)); } catch(e) { console.error('cap:', e); }
    try { renderCustodia(obj(dados.custodia)); } catch(e) {
      loadingEl.innerHTML = '<span style="color:#f87171;font-size:12px">Erro: ' + e.message + '</span>';
      setTimeout(init, 30000); return;
    }
    try { renderReceita(obj(dados.receita)); } catch(e) { console.error('rec:', e); }
    loadingEl.style.display = 'none';
    goToSlide(0);
  }).catch(function(e) {
    loadingEl.innerHTML = '<span style="color:#f87171;font-size:13px">Falha na API: ' + e.message + '<br>Tentando em 30s...</span>';
    setTimeout(init, 30000);
  });
}

setInterval(function() {
  fetchDados().then(function(data) {
    dados = data;
    try { renderCaptacao(obj(dados.captacao)); } catch(e) {}
    try { renderCustodia(obj(dados.custodia)); } catch(e) {}
    try { renderReceita(obj(dados.receita)); } catch(e) {}
    renderFooter();
  }).catch(function() {});
}, REFRESH_INTERVAL);

init();
</script>
</body>
</html>
